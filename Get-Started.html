<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <link href="./output.css" rel="stylesheet"><!--Loads the compiled Tailwind CSS file. Tailwind generates this CSS after processing your project.-->
    <link rel="stylesheet" href="./css/main.css"><!--Loads a custom CSS file where you can override Tailwind styles or add your own.-->
    
    <title>AscendShip ~ Get Started</title>
</head>

<body class="bg-black text-white">
   
    <!--NavBar-->
    <nav class="p-4">

        <!--NavBar Section--> 
        <section id="menu">
            <div class="fixed top-0 left-0 w-full h-10 z-50 bg-grey2 bg-opacity-80 flex items-center px-8">
                <!--Logo-->
                <div>
                    <a href="index.html">
                        <img src="images/logo.png" alt="Logo" class="w-36 h-auto">
                    </a>
                </div>
            </div>
        </section>
    </nav>

    <!--Middle Box-->
    <section id="middle-box" class="flex items-center justify-center min-h-screen space-x-8">
        <div class="bg-grey2 bg-opacity-80 rounded-lg w-120 h-120 mt-4">

           <h2 class="text-4xl text-white font-bold underline text-center pt-12 ">Sign In</h2>

           <h3 class="text-lg text-white pl-6 pt-16 pb-2 "><span class="text-red2 mr-1">*</span>Email</h3>
                <input type="text" class="flex mx-20 px-4 w-80 rounded-full focus:outline-none" placeholder="Enter your email"/>

           <h4 class="text-lg text-white pl-6 pt-8 pb-2"><span class="text-red2 mr-1">*</span>Password</h3>
                <input type="text" class="flex mx-20 px-4 w-80 rounded-full focus:outline-none" placeholder="Enter your password"/>

           <h5 class="text-lg text-white text-sm pl-64 pt-4 pb-4 hover:text-violet-400">Forgot your password?</h3>

           <div class="flex flex-row justify-between mx-10 pt-4">     
             <h6 class="flex flex-row text-xl font-semibold tracking-tight text-white pl-4 pt-4">Don't have an account?</h6>
                <button  class="px-6 py-4 text-white bg-purple2 rounded-full font-bold hover:bg-darkPurple2 hover:font-bold ">Sign Up</button>
           </div>

    </section>
</body>
</html>
